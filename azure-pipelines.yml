trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: kv-secrets

stages:

# =========================
# 1. PLAN STAGE
# =========================
- stage: Plan
  displayName: Terraform Plan

  jobs:
  - job: PlanJob
    steps:

    # 🔥 ALWAYS CLEAN WORKSPACE (FIXES CACHE + PLUGIN ISSUES)
    - script: |
        echo "Cleaning Terraform workspace..."
        rm -rf .terraform
        rm -rf **/.terraform
        rm -rf .terraform.lock.hcl
      workingDirectory: infra/vm
      displayName: Clean Terraform Cache

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.15.3'

    # INIT
    - task: TerraformTaskV4@4
      displayName: Terraform Init
      env:
        TF_PLUGIN_CACHE_DIR: ""
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: 'infra/vm'
        backendServiceArm: 'terraform-interview'
        backendAzureRmResourceGroupName: 'tf-backend-fordemopratice-rg'
        backendAzureRmStorageAccountName: 'tfstate12345milan'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'
        commandOptions: '-reconfigure -upgrade -get=true'

    # PLAN (SAVE OUTPUT PROPERLY)
    - task: TerraformTaskV4@4
      displayName: Terraform Plan
      env:
        TF_PLUGIN_CACHE_DIR: ""
        TF_VAR_admin_username: $(admin-username)
        TF_VAR_admin_password: $(admin-password)
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: 'infra/vm'
        environmentServiceNameAzureRM: 'terraform-interview'
        commandOptions: '-out=tfplan'

    # SAVE PLAN AS ARTIFACT
    - task: PublishPipelineArtifact@1
      displayName: Publish Terraform Plan
      inputs:
        targetPath: 'infra/vm/tfplan'
        artifact: 'tfplan'


# =========================
# 2. APPROVAL STAGE
# =========================
- stage: Approval
  displayName: Manual Approval
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - job: WaitForApproval
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: ''
        instructions: 'Please review Terraform plan and approve deployment'
        onTimeout: 'reject'


# =========================
# 3. APPLY STAGE
# =========================
- stage: Apply
  displayName: Terraform Apply
  dependsOn: Approval
  condition: succeeded()

  jobs:
  - job: ApplyJob
    steps:

    # CLEAN WORKSPACE AGAIN (CRITICAL FIX)
    - script: |
        echo "Cleaning Terraform workspace..."
        rm -rf .terraform
        rm -rf .terraform.lock.hcl
      workingDirectory: infra/vm
      displayName: Clean Terraform Cache

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.15.3'

    # INIT (FRESH EVERY TIME)
    - task: TerraformTaskV4@4
      displayName: Terraform Init
      env:
        TF_PLUGIN_CACHE_DIR: ""
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: 'infra/vm'
        backendServiceArm: 'terraform-interview'
        backendAzureRmResourceGroupName: 'tf-backend-fordemopratice-rg'
        backendAzureRmStorageAccountName: 'tfstate12345milan'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'
        commandOptions: '-reconfigure -upgrade -get=true'

    # APPLY (NO tfplan FILE ISSUE)
    - task: TerraformTaskV4@4
      displayName: Terraform Apply
      env:
        TF_PLUGIN_CACHE_DIR: ""
        TF_VAR_admin_username: $(admin-username)
        TF_VAR_admin_password: $(admin-password)
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: 'infra/vm'
        environmentServiceNameAzureRM: 'terraform-interview'
        commandOptions: '-auto-approve'