trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: kv-secrets


stages:

# =========================
# 1. PLAN STAGE
# =========================
- stage: Plan
  displayName: Terraform Plan
  jobs:
  - job: PlanJob
    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.15.3'

    - task: TerraformTaskV4@4
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: 'infra/vm'
        backendServiceArm: 'terraform-interview'
        backendAzureRmResourceGroupName: 'tf-backend-fordemopratice-rg'
        backendAzureRmStorageAccountName: 'tfstate12345milan'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'
        commandOptions: '-reconfigure'

    - task: TerraformTaskV4@4
      displayName: Terraform Plan
      env:
        TF_VAR_admin_username: $(admin-username)
        TF_VAR_admin_password: $(admin-password)
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: 'infra/vm'
        environmentServiceNameAzureRM: 'terraform-interview'
        commandOptions: '-out=tfplan'

    - task: PublishPipelineArtifact@1
      displayName: Publish tfplan artifact
      inputs:
        targetPath: 'infra/vm'
        artifact: 'tfplan'


# =========================
# 2. APPROVAL STAGE
# =========================
- stage: Approval
  displayName: Manual Approval Gate
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - job: ApprovalJob
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: |
          Review Terraform plan before applying.
          Approve only if changes are valid.
        onTimeout: 'reject'


# =========================
# 3. APPLY STAGE
# =========================
- stage: Apply
  displayName: Terraform Apply
  dependsOn: Approval
  condition: succeeded()

  jobs:
  - job: ApplyJob
    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.15.3'

    # 🔥 FIX: Download artifact from Plan stage
    - task: DownloadPipelineArtifact@2
      displayName: Download tfplan
      inputs:
        artifact: 'tfplan'
        path: 'infra/vm'

    - task: TerraformTaskV4@4
      displayName: Terraform Apply
      env:
        TF_VAR_admin_username: $(admin-username)
        TF_VAR_admin_password: $(admin-password)
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: 'infra/vm'
        environmentServiceNameAzureRM: 'terraform-interview'
        commandOptions: 'tfplan'